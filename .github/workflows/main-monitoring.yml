name: Main monitoring

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: E2E & accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Regression] E2E tests failed on main (${sha})`,
              body: [
                '## E2E / accessibility regression detected',
                '',
                `**Commit:** [\`${sha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
                `**Workflow run:** [View logs](${runUrl})`,
                '',
                '### Next steps',
                '1. Check the logs linked above to identify the failing test',
                '2. Fix the regression on a feature branch',
                '3. Close this issue once merged',
              ].join('\n'),
              labels: ['bug', 'regression'],
            });
